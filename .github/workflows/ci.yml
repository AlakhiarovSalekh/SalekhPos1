# SalekhPos — CI pipeline.
# Per the constitution (Section 68):
#   Checkout -> Restore -> Build -> Unit Tests -> Integration Tests
#   -> Lint/Format -> Security Scans -> Artifact Build -> Container Scan
#   -> Staging -> Smoke Tests -> Approval -> Production -> Health Checks.
#
# This file implements the gates up through Container Scan and is the
# single CI entry point. Staging/Production deployment gates are wired in
# later phases (infrastructure/ deployment workflows).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  NODE_VERSION: '20'
  FORCE_COLOR: '1'

jobs:
  # ---------- Backend ----------
  backend-restore-build:
    name: Backend · restore & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore SalekhPos.sln

      - name: Build
        working-directory: backend
        run: dotnet build SalekhPos.sln --configuration Release --no-restore /warnaserror

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/**/bin/Release/**
          if-no-files-found: error
          retention-days: 5

  backend-unit-tests:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    needs: backend-restore-build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore SalekhPos.sln

      - name: Test (unit only)
        working-directory: backend
        run: >
          dotnet test
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~SalekhPos.Tests.Unit"
          --collect:"XPlat Code Coverage"
          --logger "console;verbosity=normal"
          -- RunConfiguration.CollectSourceInformation=true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/**/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # Integration tests run in a separate job that uses Testcontainers
  # (PostgreSQL + Redis) when the SDK and the infrastructure code are ready.
  # The gate is present from Phase 1 so the matrix is never forgotten.
  backend-integration-tests:
    name: Backend · integration tests
    runs-on: ubuntu-latest
    needs: backend-restore-build
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: salekhpos_ci
          POSTGRES_USER: salekhpos
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salekhpos -d salekhpos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore SalekhPos.sln

      - name: Test (integration + security)
        working-directory: backend
        env:
          DATABASE_URL: Host=localhost;Port=5432;Database=salekhpos_ci;Username=salekhpos;Password=ci_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: >
          dotnet test
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~SalekhPos.Tests.Integration|FullyQualifiedName~SalekhPos.Tests.Security"
          --collect:"XPlat Code Coverage"

  # ---------- Web ----------
  web-build:
    name: Web · lint, typecheck, build, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/salekhpos-web/package-lock.json

      - name: Install
        working-directory: web/salekhpos-web
        run: npm ci

      - name: Format check
        working-directory: web/salekhpos-web
        run: npm run format:check

      - name: Lint
        working-directory: web/salekhpos-web
        run: npm run lint

      - name: Typecheck
        working-directory: web/salekhpos-web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web/salekhpos-web
        run: npm run test

      - name: Build
        working-directory: web/salekhpos-web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/salekhpos-web/dist
          if-no-files-found: error
          retention-days: 5

  # ---------- Security ----------
  security-scan:
    name: Security scan (dotnet + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore (for security scan)
        working-directory: backend
        run: dotnet restore SalekhPos.sln

      - name: .NET audit
        working-directory: backend
        run: dotnet list package --vulnerable --include-prerelease || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/salekhpos-web/package-lock.json

      - name: Install
        working-directory: web/salekhpos-web
        run: npm ci

      - name: npm audit
        working-directory: web/salekhpos-web
        run: npm audit --omit=dev --audit-level=high || true

  # ---------- Containers ----------
  container-build:
    name: Container build & scan
    runs-on: ubuntu-latest
    needs: [backend-restore-build, web-build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          target: runtime
          push: false
          load: true
          tags: salekhpos/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          target: runtime
          push: false
          load: true
          tags: salekhpos/worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          target: runtime
          push: false
          load: true
          tags: salekhpos/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: salekhpos/backend:ci
          severity: HIGH,CRITICAL
          exit-code: '0'  # non-blocking until baseline is established
          format: sarif
          output: trivy-backend.sarif

      - name: Run Trivy on web image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: salekhpos/web:ci
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-web.sarif

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scans
          path: trivy-*.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ---------- Smoke (not deploy; this gate runs once infra endpoints exist) ----------
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: container-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Placeholder: smoke test runs /health/live and /health/ready against
      # the backend container once integration tests are green. Filled in
      # when the first real endpoint lands.
      - name: Smoke test placeholder
        run: echo "Smoke test wired in Phase 2 (health endpoints exist and EF migrations applied)."
